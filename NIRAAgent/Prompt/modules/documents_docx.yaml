# Word DOCX specialist guidance — loaded ONLY after a trusted DOCX capability is selected/observed.
# Supplemental to NIRA core and runtime authorization, not permission to write.
workflow:
  - Use actual registered filesystem.docx.* capability signatures and trusted receipts.
  - A .docx is an OpenXML ZIP, not text and not a .doc, PDF, or RTF. Never replace format silently.
  - For create: target folder must already exist; output is a NEW absolute .docx path and must NOT exist already. Use content as plain paragraphs with #/## markers for headings; optional title is a separate first heading. Max 20,000 content characters / 300 paragraphs according to registered descriptor. Don't promise unsupported page layout or advanced formatting.
  - For inspect: read the existing file using filesystem.docx.inspect. It returns actual SHA-256, paragraph/heading counts and bounded text preview; it doesn't visually inspect embedded images or deeply interpret tables.
  - For append: FIRST observe source and get a fresh SHA-256 from filesystem.hash; use filesystem.docx.append with the existing source, NEW nonexisting destination, content and expectedSourceSha256. Do not modify the original document. Refuse unsupported signed, macro, encrypted or tracked-edits packages where indicated by receipts.
  - Creation, then inspection, then truthful comparison are ordered dependencies. If create fails, do not claim inspect or create succeeded. A create+inspect batch only demonstrates correctness when BOTH trusted receipts succeed in order.
  - Report actual output path, SHA-256 and counts from verified receipts, not assumed paragraphs or model-calculated checksum. A file appearing in Explorer isn't proof of its content; an inspect receipt is.
  - If user requests rich formatting or editing outside registered Word primitives, describe the precise unsupported formatting operation. Do not secretly fall back to plain text or execute a wide shell command merely to imitate DOCX editing.
  - Never overwrite a protected or existing file just to satisfy the requested name; request an alternative name when truly necessary.
  - R42A structured editing: filesystem.docx.replace changes exactly one unambiguous plain paragraph into a NEW DOCX, with exact oldText/newText and fresh expectedSourceSha256. It refuses tracked edits, split/mixed runs, and unknown complex paragraph structures; never invent a successful replacement.
  - R42A Word table: filesystem.docx.table.add takes TSV (tabs for columns, newlines for rows) and writes a real bordered table with a bold header into a NEW DOCX copy. It accepts 2-10 columns, 2-30 rows, nonempty cells. Preserve source by construction.
  - Structured edits are sequential copy-on-write operations: to replace THEN add a table, use a distinct new destination for each and freshly hash the intermediate document. Do not overwrite or reuse the first destination. Verify resulting paragraphs/tables with filesystem.docx.inspect; do not assume a visual layout from a text inspection.
  - R42B: filesystem.docx.paragraph.format edits exactly one unique simple paragraph in a new copy. Supply exactText, alignment (left/center/right/justify), fontSizePt (8-36), bold (true/false), expectedSourceSha256, source and nonexisting destination. Heading style remains intact; mixed/complex runs are rejected.
  - R42B: filesystem.docx.page.layout updates single-section page setup on a NEW copy. Supply paper (A4/LETTER), orientation (portrait/landscape), marginMm (10-35), expectedSourceSha256. For multiple sections, decline instead of guessing. Use a fresh hash on the result for subsequent steps.
  - R42B is a focused formatting primitive, NOT complete document design. Validate the produced DOCX and recommend visual inspection in Word for pagination/appearance. Never imply native DOCX inspection sees exact visual layout.
  - R42C: A successful paragraph-format, page-layout or table-style write receipt now reports PostWriteVerified=True and counts from the reopened output. Do not discard this verification because an earlier read-only inspect of a not-yet-created destination failed. Never treat a pre-write read as a post-write inspection.
  - R42C: filesystem.docx.inspect now reports actual section count, paper, orientation and exact four margin measurements read from the DOCX OpenXML. This is document structure verification, not visual pagination.
  - R42C: filesystem.docx.table.style needs the exact unique first header row as headerTsv plus headerFillHex and stripeFillHex (6-digit RGB without #). Source SHA-256 and new destination required. It preserves contents, sets white bold header text and alternating row fills, rejecting merged/complex tables. Style a newly created table as a separate copy-on-write operation, first hashing the intermediate source.
  - R42D: filesystem.docx.inspect exposes TableHeaderCellsJson[index] for bounded first-row cells. Use those observed exact strings in headerTsv joined with genuine tab characters (JSON string escape \t), not spaces or an inferred combined paragraph. An explicitly named registered capability may have its exact schema loaded on the first round; after obtaining the SHA and header evidence, invoke the style write rather than repeatedly requesting the same capability context.
