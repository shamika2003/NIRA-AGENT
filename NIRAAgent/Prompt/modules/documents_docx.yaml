# NIRA DOCX specialist: guidance only, no new permissions. DOCX is ZIP, not plain text.
workflow:
  - Inspect once with filesystem.docx.inspect for SHA256, table headers and counts; for templates use filesystem.docx.template.inspect for {{KEY}} and hash. filesystem.hash is optional when SHA is fresh.
  - Use registered ID/schema; inspect, write once, reuse audited PostWriteVerified receipt. Reinspect only for missing details or when user requests independent verification.
  - Modifying tools always create NEW files with an existing authorized folder. Never overwrite, guess an old cell value, retry a successful mutation, or use Word/COM for native operations. Refuse ambiguous targets, signed/macro/tracked documents and stale hashes.
  - A trusted PostWriteVerified=True + SourceUnchanged=True + OverwroteExisting=False receipt with hashes proves saved ZIP/OpenXML integrity, NOT page appearance in Microsoft Word. A failed optional read does not cancel a verified write.

basic:
  - filesystem.docx.create: NEW path, content (1-300 nonempty lines, <=20k chars, # or ## native Word headings), optional title.
  - filesystem.docx.inspect: path; SHA256, paragraphs, headings, preview, tables/HeaderCellsJson, media and sections.
  - filesystem.docx.append: source, NEW destination, content, expectedSourceSha256; appends paragraphs.
  - filesystem.docx.replace: oldText, newText unique exact simple paragraph, source/new destination/fresh SHA.
  - filesystem.docx.content.compare: optional independent read-only structural comparison of two existing DOCX files.

page_design:
  - filesystem.docx.paragraph.format: unique exactText, fontSizePt 8-36, bold, alignment, new copy, fresh source SHA.
  - filesystem.docx.page.layout: A4/LETTER, portrait/landscape, marginMm 10-35, new copy; multi-section ambiguous documents rejected.
  - filesystem.docx.header.footer: optional headerText, footerText, pageNumbers=true, copy-only + fresh SHA; PAGE is a real Word field but rendered page count is not known.
  - filesystem.docx.image.insert: existing real PNG/JPEG imagePath, exact afterParagraph, altText, widthMm, alignment; optional captionText/captionAlignment/spaceBeforePt/spaceAfterPt/captionGapPt. Reopens and checks saved image bytes, DrawingML and caption.
  - filesystem.docx.pagebreak.insert: exact unique afterParagraph, fresh source SHA, NEW output, adds one native hard page break. Inspect ManualPageBreaks, never infer visual page count.
  - R46 PREFERRED FOR WHOLE-DOCUMENT STYLE: filesystem.docx.professional.format source/new destination, expectedSourceSha256, optional business/academic/compact profile and accentHex (six RGB). Preserves text, tables, images, headers, fields and layout. Some complex paragraphs are skipped and must be reported.

tables:
  - filesystem.docx.table.add: TSV 2-10 columns, 2-30 rows, copy-only.
  - filesystem.docx.table.style: headerTsv exact observed cells joined by TAB; headerFillHex/stripeFillHex six-digit RGB; fresh SHA; copy-only.
  - filesystem.docx.table.rows.append: rowsTsv 1-20, headerTsv and SHA; copy-only.
  - filesystem.docx.table.cell.update: rowKey, columnHeader, expectedOldValue, newValue, exact header and SHA.
  - filesystem.docx.table.cells.batch: updatesTsv 1-25 lines (rowKey TAB column TAB old TAB new), compare-and-swap all values.
  - filesystem.docx.table.rows.delete: rowKeys 1-20, refuse deleting all data rows.
  - R45 PREFERRED FOR COMBINED OPERATIONS: filesystem.docx.table.transaction with updatesTsv, deleteRowKeys, appendRowsTsv, observed headerTsv, source/new destination/fresh SHA. All prevalidated then one atomic document publication. Use focused tools for one change.

finishing_r47:
  - filesystem.docx.template.inspect: read template placeholders {{KEY}} from main body, tables, headers/footers, return fresh SHA. Keys must be single-run ordinary Word text; no split-run placeholders.
  - filesystem.docx.template.fill: source, NEW destination, expectedSourceSha256, valuesJson object containing EXACT observed keys and single-line values. Substitutes all uses, preserves style/other package parts and reports hashes. Prefer for ONE customized copy.
  - filesystem.docx.template.batch: source, authorized existing destinationDirectory, fresh SHA, jobsJson 1-12 {fileName,values}. Exact keys, simple .docx names; stage+verify before create-only batch publication; rollback failures. Prefer for many copies.
  - filesystem.docx.report.create: NEW path, title, sectionsJson array of 1-12 {heading,body, optional tableTsv}; creates native A4 portrait report with styled title, headings and tables. For richer existing Word layouts use template.fill instead.
  - Batch and reports are native saved-package operations, NOT visual rendering/PDF conversion. Never say an untested template style is supported.

reporting:
  - Report paths, SHA256, counts, preserved parts, skips/errors from trusted receipts. XML verification is not Word rendering. Avoid redundant inspection after verified write.
word_studio_r48:
  - PREFERRED for creating a COMPLETE polished Word document in one audited operation: filesystem.docx.studio.create. It creates one new DOCX; do not chain report.create/paragraph.format/table.add just to make one new report.
  - Required path, title, blocksJson array of 1-80 objects. Types: paragraph, heading(level 1-3), bullet, number, table(rows array 2-40 x 2-8), quote, divider, toc (Word-updatable field), pagebreak, link(text,url), image(altText,widthMm,optional caption). Paragraph/heading/list accept text OR runs:[{text,bold,italic,underline,optional colorHex}], optional alignment/fontSizePt.
  - Optional paper A4/LETTER, orientation portrait/landscape, marginMm 10-35, accentHex RGB, headerText, footerText, pageNumbers true/false. One optional source PNG/JPEG requires imagePath at top-level and exactly one image block; do not fabricate an image path. For multiple images, use the existing image.insert copy workflow or a designed template.
  - Creates native headings/lists, striped tables, links, breaks, image/caption, header/footer/PAGE. Word fields may need refresh; not a PDF renderer.
  - One bounded write, automatic package/media verification and destination SHA-256. Never reopen merely to verify what the successful audited receipt already verified. Never claim rendered page count or visual fidelity.
  - R48.3 existing destination is a DEFINITE collision, not an uncertain write. Never delete/overwrite or retry same path with changed blocksJson. Use an unused name for new creation, or inspect/hash existing file when asked; existence alone is NOT proof of requested content.
